<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون</title>
<style>
    :root {
        --bg-overlay: rgba(13, 14, 16, 0.45);
        --panel-bg: rgba(25, 28, 32, 0.75);
        --border-glass: rgba(255, 255, 255, 0.12);
        --accent: #a78bfa;
        --accent-glow: rgba(167, 139, 250, 0.4);
        --text-main: #ffffff;
        --text-sub: #cbd5e1;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        background-image: 
            linear-gradient(var(--bg-overlay), var(--bg-overlay)),
            url("icon0.png");
        background-size: 100% 100%;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        color: var(--text-main);
        min-height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: inherit;
        filter: blur(2px);
        z-index: -1;
    }

    .shell {
        width: 100%;
        max-width: 600px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        padding: 15px 25px;
        border-radius: 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brand-img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
    }

    .brand-name {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #ffffff;
        text-align: center;
    }

    .wrap {
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .status-panel {
        background: rgba(15, 17, 20, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 30px 25px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        min-height: 120px;
    }

    /* تصميم مؤشر التحميل Spinner بألوان التصميم الجديد */
    #spin {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px var(--accent-glow);
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    #msg {
        font-size: 1.1rem;
        font-weight: 600;
        color: #f87171;
        display: none;
    }

    #state {
        display: none;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent-glow);
        margin-bottom: 10px;
    }

    #out {
        display: none;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.45;
        background: rgba(10, 12, 15, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px 15px;
        max-height: 300px;
        overflow-y: auto;
        color: var(--text-sub);
        text-align: left;
    }

    /* حالة الانتهاء والفشل وسجل الأخطاء Log */
    body.done #spin {
        display: none;
    }

    body.fail #spin {
        display: none;
    }

    body.fail #msg {
        display: block;
    }

    body.log #spin,
    body.log #msg {
        display: none;
    }

    body.log #state,
    body.log #out {
        display: block;
    }

    /* ألوان حالات السجل */
    .ok, .safe { color: #4ade80; }
    .bad, .danger { color: #f87171; }
    .warn { color: #facc15; }
    code { color: #93c5fd; }
</style>
</head>
<body>

<div class="shell">

    <main class="wrap" id="wrap">
        <section class="status-panel">
            <div id="spin"></div>
            <div id="msg">Restart your console</div>
            <div id="state"></div>
            <div id="out"></div>
        </section>
    </main>
</div>


<script type="module">import "./jb.js";</script>
</body>
</html>
