<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة أورجينال لصيانة البلايستيشن - أسيوط</title>
    
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #0072ff;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-sub);
        }

        .status-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 24px;
            min-height: 180px;
            transition: all 0.3s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader.done {
            display: none;
        }

        .state-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
        }

        .state-text small {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 400;
        }

        .status-box.done {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.1);
        }

        .status-box.done .state-text {
            color: var(--success);
        }

        .status-box.error {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.1);
        }

        .status-box.error .state-text {
            color: var(--error);
        }

        .footer-info {
            font-size: 0.8rem;
            color: var(--text-sub);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            line-height: 1.5;
        }

        .contact-nums {
            margin-top: 6px;
            direction: ltr;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="brand-title">شركة أورجينال لصيانة البلايستيشن</h1>
            <p class="brand-subtitle">فرع أسيوط - ش الجمهورية</p>
        </div>

        <div id="state" class="status-box">
            <div id="loader" class="loader"></div>
            <div id="stateText" class="state-text">
                جارٍ تشغيل الثغرة...<br>
                <small>Exploit is running, please wait...</small>
            </div>
        </div>

        <div class="footer-info">
            <div>خدمات صيانة وسوفت وير احترافية</div>
            <div class="contact-nums">01017096872 | 01115550903</div>
        </div>
    </div>

    <!-- استدعاء السكريبت بشكل تقليدي لتفادي مشاكل الـ ES6 Modules في متصفح البلايستيشن -->
    <script src="chain_poops.js"></script>

    <script>
        (function() {
            var loader = document.getElementById("loader");
            var state = document.getElementById("state");
            var stateText = document.getElementById("stateText");

            // الدالة التي يتم استدعاؤها عند نجاح الثغرة
            window.poopsDone = function () {
                if (loader) loader.classList.add("done");
                if (state) state.classList.add("done");
                if (stateText) {
                    stateText.innerHTML =
                        "اكتملت العملية بنجاح<br>" +
                        "<small>Done successfully...</small>";
                }
            };

            // الدالة التي يتم استدعاؤها في حالة حدوث خطأ
            window.poopsError = function () {
                if (loader) loader.classList.remove("done");
                if (state) state.classList.add("error");
                if (stateText) {
                    stateText.innerHTML =
                        "حدث خطأ أثناء التنفيذ<br>" +
                        "<small>Something went wrong...</small>";
                }
            };
        })();
    </script>
</body>
</html>
