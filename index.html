<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original PS4 Jailbreak</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e6ebf2;
    overflow: hidden;
    background-color: #0b0d10;
  }

  /* خلفية مخصصة مع تأثير الضباب (Blur) */
  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* يمكنك تغيير رابط الخلفية هنا */
    background-image: url("icon0.png");
    background-size: cover;
    background-position: center;
    filter: blur(8px) brightness(0.6);
    transform: scale(1.05); /* لمنع حواف البلور من الظهور بشكل مقصوص */
    z-index: 1;
  }

  /* شريط العلامة التجارية العلوي */
  #brand {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(14, 17, 22, 0.4);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 10;
  }

  #brand img {
    width: 32px;
    height: 32px;
    margin-right: 12px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  }

  #brand b {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: #ffffff;
    text-transform: uppercase;
  }

  /* الحاوية الرئيسية في منتصف الشاشة */
  #wrap {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* البرواز الشفاف في المنتصف (Glassmorphism Box) */
  .status-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 32px 40px;
    text-align: center;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  #state {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  #det {
    font-size: 14px;
    color: #a0aab8;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  #det b {
    color: #ffffff;
    font-weight: 600;
  }

  #cache {
    font-size: 12px;
    color: #727e8e;
    min-height: 16px;
  }

  #cache.cacheok { color: #52e595; }
  .ok { color: #52e595; }
  .bad { color: #ff5c5c; }
  .warn { color: #f5c042; }
</style>
</head>
<body>

<!-- خلفية الصورة مع التغبيش -->
<div class="bg-overlay"></div>

<!-- الهيدر العلوي -->
<div id="brand">
  <b>ORIGINAL</b>
</div>

<!-- محتوى المنتصف -->
<div id="wrap">
  <div class="status-card">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<script>
    // [كود الجافاسكريبت الأصلي بدون تغيير لضمان عمل الثغرة]
    var msgs = document.getElementById('msgs');
    var runBtn = document.getElementById('runBtn');

    function updateStatus(msg, cls) {
        msgs.innerHTML = msg;
        msgs.className = 'status-text' + (cls ? ' ' + cls : '');
    }

    var uaFull = navigator.userAgent;
    var match = uaFull.match(/PlayStation 4[ \/](\d+)\.(\d+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] + "." + match[2] : "Unknown";
    var fwNum = 0;
    var key = null;
    var bug = null;

    if (match) {
        key = match[1] + "." + match[2];
        fwNum = parseInt(match[1], 10) * 100 + parseInt(match[2], 10);
    }

    if (isPS4) {
        if (fwNum <= 1202) {
            bug = "lapse";
        } else if (fwNum >= 1250) {
            bug = "poops";
        }
    }

    var redirected = false;
    var reloadedOnce = false;
    var RELOAD_KEY = 'original_host_reloaded_v1';

    function redirectToRun() {
        if (redirected || !isPS4 || !bug) return;
        redirected = true;
        var target = bug === 'lapse' ? 'run_lapse.html' : 'run_poops.html';
        updateStatus('🚀 Loading ' + (bug === 'lapse' ? 'Lapse' : 'Poops') + ' exploit...');
        window.location.replace(target);
    }

    var cacheState = 'unknown';
    var SAFETY_MS = 30000;

    function showRunButton() {
        runBtn.className = 'btn';
    }

    var appCache = window.applicationCache;
    if (appCache) {
        appCache.addEventListener('checking', function() {
            updateStatus('⏳ Checking cache...');
        }, false);
        appCache.addEventListener('downloading', function() {
            updateStatus('📥 Installing cache (first visit)...');
        }, false);
        appCache.addEventListener('progress', function(e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                updateStatus('📥 Caching ' + pct + '%...');
            }
        }, false);
        appCache.addEventListener('cached', function() {
            cacheState = 'cold';
            updateStatus('✅ Cache installed. Press ▶ Run now to start.', 'success');
            showRunButton();
        }, false);
        appCache.addEventListener('noupdate', function() {
            cacheState = 'warm';
            updateStatus('✅ Cache ready -- starting...', 'success');
            setTimeout(redirectToRun, 600);
        }, false);
        appCache.addEventListener('updateready', function() {
            try { appCache.swapCache(); } catch (e) {}
            if (!reloadedOnce) {
                reloadedOnce = true;
                try { sessionStorage.setItem(RELOAD_KEY, '1'); } catch (e) {}
                updateStatus('🔄 Update ready -- reloading once...');
                setTimeout(function() { location.reload(); }, 300);
            } else {
                cacheState = 'warm';
                updateStatus('✅ Cache updated -- starting...', 'success');
                setTimeout(redirectToRun, 600);
            }
        }, false);
        appCache.addEventListener('error', function() {
            cacheState = 'error';
            updateStatus('⚠️ Cache unavailable -- press ▶ Run now (network mode).');
            showRunButton();
        }, false);
        appCache.addEventListener('obsolete', function() {
            cacheState.error;
            updateStatus('⚠️ Cache obsolete -- press ▶ Run now.');
            showRunButton();
        }, false);
    }

    document.addEventListener("DOMContentLoaded", function() {
        if (key) {
            var cards = document.querySelectorAll('.fw-card');
            for (var i = 0; i < cards.length; i++) {
                if (cards[i].getAttribute('data-fw') === key) {
                    cards[i].className += ' active';
                }
            }
        }

        if (!isPS4) {
            updateStatus('⚠️ This page is for PS4 only!', 'error');
            return;
        }

        if (!bug) {
            updateStatus('❌ Unsupported Firmware: ' + fwVersion, 'error');
            return;
        }

        updateStatus('✅ Detected PS4 Firmware: ' + fwVersion
            + ' (' + (bug === 'lapse' ? 'Lapse' : 'Poops') + ' chain)');

        runBtn.className = 'btn';
        runBtn.addEventListener('click', redirectToRun, false);

        if (!appCache) {
            setTimeout(redirectToRun, 400);
            return;
        }

        setTimeout(function() {
            if (!redirected) {
                updateStatus('⏳ Cache is slow -- press ▶ Run now when ready.');
                showRunButton();
            }
        }, SAFETY_MS);
    });
</script>
</body>
</html>
