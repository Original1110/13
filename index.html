<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title> شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون </title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .container { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px 30px; width: 90%; max-width: 500px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
        .subtitle { font-size: 1rem; color: #b0c4de; margin-bottom: 25px; font-weight: 500; }
        .status-box { font-size: 1.1rem; margin-bottom: 20px; min-height: 30px; font-weight: 600; color: #e0e0e0; word-break: break-all; }
        .progress-bar-container { width: 100%; height: 14px; background: rgba(0, 0, 0, 0.4); border-radius: 10px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00c6ff, #0072ff); border-radius: 10px; transition: width 0.2s ease; box-shadow: 0 0 12px #00c6ff; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); }
        .btn:hover { background: #0072ff; border-color: #00c6ff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 114, 255, 0.4); }
        .footer { margin-top: 30px; font-size: 0.85rem; color: #8a9ba8; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Host Exploit</h1>
        <div class="subtitle">شركة أورجينال لصيانة البلايستيشن - أسيوط</div>

        <div class="status-box" id="statusMsg">جاري تجهيز التخزين الكلي...</div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <a href="PS4_13.00_Webkit.html" class="btn">تشغيل الثغرة (PS4 13.00 Webkit)</a>
            <a href="run_lapse.html" class="btn">Run Lapse</a>
            <a href="sysctl.html" class="btn">Sysctl Settings</a>
        </div>

        <div class="footer">
            احفظ الصفحة في المفضلة (Bookmarks) لفتحها أوفلاين
        </div>
    </div>

    <script>
        // تضمين المسارات المباشرة والنسبية لضمان تطابق طلب المتصفح أوفلاين
        var filesToCache = [
            './',
            'index.html',
            'PS4_13.00_Webkit.html',
            'run_lapse.html',
            'sysctl.html',
            'chain_lapse.js',
            'chain_poops.js',
            'sysctl.js',
            'core.js',
            'mem.js',
            'int64.js',
            'ps4_offsets.js',
            'rpc_worker.js',
            'payload.bin',
            './payload.bin',
            'patches/1100.bin',
            'patches/1150.bin',
            'patches/1200.bin',
            'patches/1300.bin',
            './patches/1100.bin',
            './patches/1150.bin',
            './patches/1200.bin',
            './patches/1300.bin'
        ];

        var statusMsg = document.getElementById('statusMsg');
        var progressBar = document.getElementById('progressBar');

        // تسجيل Service Worker للتحكم بالـ Fetch
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(e){ console.log(e); });
        }

        async function storeAllInCache() {
            if (!('caches' in window)) {
                statusMsg.innerText = 'متصفح الجهاز لا يدعم Cache Storage.';
                return;
            }

            try {
                var cache = await caches.open('ps4-offline-v3');
                var total = filesToCache.length;
                var loaded = 0;

                for (var i = 0; i < total; i++) {
                    var file = filesToCache[i];
                    statusMsg.innerText = 'جاري التخزين: ' + file;
                    try {
                        var res = await fetch(file);
                        if (res.ok) {
                            await cache.put(file, res.clone());
                            // حفظ نسخة أوفلاين محلياً أيضاً
                            await cache.put(new Request(file, {mode: 'no-cors'}), res);
                        }
                    } catch (e) {
                        console.log('Error caching ' + file);
                    }
                    loaded++;
                    var percent = Math.round((loaded / total) * 100);
                    progressBar.style.width = percent + '%';
                }

                progressBar.style.width = '100%';
                statusMsg.style.color = '#00ff88';
                statusMsg.innerText = 'تم التخزين بالكامل! يمكنك الاستخدام بدون إنترنت الآن.';
                localStorage.setItem('ps4_cached_v3', 'true');

            } catch (err) {
                statusMsg.style.color = '#ff4d4d';
                statusMsg.innerText = 'حدث خطأ أثناء حفظ الملفات.';
            }
        }

        window.onload = function() {
            if (localStorage.getItem('ps4_cached_v3') === 'true') {
                progressBar.style.width = '100%';
                statusMsg.style.color = '#00ff88';
                statusMsg.innerText = 'الموقع مخزن وجاهز للاستخدام الأوفلاين (Offline Ready)';
            } else {
                storeAllInCache();
            }
        };
    </script>
</body>
</html>
