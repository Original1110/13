<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <title> شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون </title>
<style>
    :root {
        /* تم تقليل التعتيم من 0.85 إلى 0.45 لتصبح الخلفية واضحة جداً */
        --bg-overlay: rgba(13, 14, 16, 0.45);
        --panel-bg: rgba(25, 28, 32, 0.75);
        --border-glass: rgba(255, 255, 255, 0.12);
        --accent: #a78bfa;
        --accent-glow: rgba(167, 139, 250, 0.4);
        --text-main: #ffffff;
        --text-sub: #cbd5e1;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        background-image: 
            linear-gradient(var(--bg-overlay), var(--bg-overlay)),
            url("icon0.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    /* تم تقليل التغبيش من 8px إلى 2px فقط لإظهار تفاصيل الصورة بكل وضوح */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: inherit;
        filter: blur(2px);
        z-index: -1;
    }

    .shell {
        width: 100%;
        max-width: 600px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        padding: 15px 25px;
        border-radius: 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .brand-logo {
        background: linear-gradient(135deg, #2c323b, #111315);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--accent);
        font-weight: 800;
        font-size: 1.1rem;
        padding: 10px 14px;
        border-radius: 10px;
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
    }

    .brand-text {
        display: flex;
        flex-direction: column;
    }

    .brand-name {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #ffffff;
    }

    .brand-sub {
        font-size: 0.8rem;
        color: var(--text-sub);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .badge {
        background: rgba(167, 139, 250, 0.15);
        border: 1px solid rgba(167, 139, 250, 0.4);
        color: var(--accent);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .wrap {
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .hero {
        text-align: center;
    }

    .hero-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 6px;
        color: #ffffff;
    }

    .accent {
        color: var(--accent);
        text-shadow: 0 0 15px var(--accent-glow);
    }

    .hero-sub {
        font-size: 0.95rem;
        color: var(--text-sub);
    }

    .status-panel {
        background: rgba(15, 17, 20, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 25px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .status-text {
        font-size: 1.05rem;
        font-weight: 500;
        color: #ffffff;
    }

    .status-text.error {
        color: #f87171;
    }

    .btn {
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: #ffffff;
        border: none;
        padding: 12px 28px;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .hidden {
        display: none !important;
    }

    .foot {
        text-align: center;
        font-size: 0.85rem;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        padding-top: 5px;
    }
</style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <span class="brand-name">ORIGINAL HOST</span>
        </div>
    </header>

    <main class="wrap">
        <section class="hero">
            <h1 class="hero-title">Poops <span class="accent">Exploit</span></h1>
            <p class="hero-sub">Firmware 12.50 - 13.00</p>
        </section>

        <section class="status-panel">
            <span id="state" class="status-text loading">⏳ Please wait...</span>
            <button id="retry" class="btn hidden" type="button">↻ Retry</button>
        </section>

        <div id="out" style="display:none;"></div>
    </main>

    <footer class="foot">
        <p>© ORIGINAL - Asyut | Exclusive Development</p>
    </footer>
</div>

<script type="module">
    var started = false;

    function boot() {
        if (started) return;
        started = true;
        import("./chain_poops.js").catch(function(e) {
            var stateEl = document.getElementById("state");
            stateEl.innerHTML = "❌ Failed: "
                + (e && e.message ? e.message : e);
            stateEl.className = "status-text error";
            var btn = document.getElementById("retry");
            if (btn) btn.className = "btn";
        });
    }

    function bootSettled() { setTimeout(boot, 1200); }

    var appCache = window.applicationCache;
    if (appCache) {
        appCache.addEventListener('cached', bootSettled, false);
        appCache.addEventListener('noupdate', bootSettled, false);
        appCache.addEventListener('error', bootSettled, false);
        appCache.addEventListener('obsolete', bootSettled, false);
        setTimeout(bootSettled, 6000);
    } else {
        bootSettled();
    }

    document.getElementById("retry").addEventListener("click", function() {
        location.reload();
    }, false);

    window.addEventListener("error", function(e) {
        var stateEl = document.getElementById("state");
        if (stateEl && stateEl.textContent === "⏳ Please wait...") {
            stateEl.innerHTML = "❌ " + (e && e.message ? e.message : "Script error");
            stateEl.className = "status-text error";
        }
    }, false);
</script>
</body>
</html>
